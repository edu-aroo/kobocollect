        - { text: "Need help?",                    href: help.html }
        - { text: "What's new",                    href: whats-new.html }

output:
  html_document:
    theme: flatly            # Bootstrap theme (colours overridden in course.css)
    highlight: tango
    css: assets/course.css
    toc: false               # the table of contents is built by course.js
    self_contained: false    # keep JS/CSS as separate files (required for a site)
    includes:
      in_header: assets/header.html   # loads config.js + course.js on every page
