<!-- ===========================================================================
  slides-engine.html — turns a normal R Markdown html_document into slides.
  Inserted in <head> by the YAML of each deck (includes: in_header).
  In the .Rmd:  "## Title" = one slide · "## Title {.segue}" = section divider
                <div class="notes"> ... </div> = speaker notes (press N)
  Keys: → / Space / PageDown = next · ← / PageUp = previous · Home / End
        F = full screen · N = show/hide notes · O = overview of all slides
  Each slide is a 1280 × 720 box scaled to the window, so it looks the same on
  any screen or projector. Content that is too long is shrunk automatically.
=========================================================================== -->
<script>
(function () {
  "use strict";
  let slides = [], cur = 0;

  function build() {
    document.body.classList.add("deck");
    const stage = document.createElement("div");
    stage.id = "stage";
    // slide 0 = the title block made by R Markdown (#header)
    // (theme: null puts h1.title / h3.subtitle / h4.author directly in <body>)
    const header = document.getElementById("header");
    const titleParts = header ? [header]
      : Array.from(document.querySelectorAll("h1.title, h3.subtitle, h4.author, h4.date"));
    if (titleParts.length) { const s = wrap(titleParts); s.classList.add("title-slide"); stage.appendChild(s); }
    // every "## Title" section = one slide
    document.querySelectorAll("div.section.level2").forEach(sec => {
      const s = wrap([sec]);
      if (sec.classList.contains("segue")) s.classList.add("segue");
      stage.appendChild(s);
    });
    document.body.innerHTML = "";
    document.body.appendChild(stage);
    slides = Array.from(stage.children);

    const bar = document.createElement("div");
    bar.id = "deck-bar";
    document.body.appendChild(bar);
    const sig = document.createElement("div");
    sig.id = "deck-sign"; sig.textContent = "by Aroo Falinirina";
    document.body.appendChild(sig);

    const n = parseInt(location.hash.replace("#", ""), 10);
    show(isNaN(n) ? 0 : Math.min(Math.max(n - 1, 0), slides.length - 1));
    window.addEventListener("resize", scale);
    scale();
    slides.forEach(fit);
  }

  function wrap(nodes) {
    const s = document.createElement("section");
    s.className = "slide";
    const inner = document.createElement("div");
    inner.className = "slide-inner";
    nodes.forEach(n => inner.appendChild(n));
    s.appendChild(inner);
    return s;
  }

  // scale the 1280 x 720 slide to the window
  function scale() {
    const k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.documentElement.style.setProperty("--k", k);
  }

  // shrink the font of a slide until its content fits in the box
  function fit(s) {
    const inner = s.querySelector(".slide-inner");
    let size = 100;
    s.style.display = "block";
    const base = parseFloat(getComputedStyle(inner).fontSize);   // 27px in slides.css
    while (inner.scrollHeight > inner.clientHeight + 2 && size > 62) {
      size -= 4; inner.style.fontSize = (base * size / 100) + "px";
    }
    s.style.display = "";
  }

  function show(i) {
    if (i < 0 || i >= slides.length) return;
    slides[cur].classList.remove("current");
    cur = i;
    slides[cur].classList.add("current");
    history.replaceState(null, "", "#" + (cur + 1));
    const bar = document.getElementById("deck-bar");
    bar.textContent = (cur + 1) + " / " + slides.length;
    bar.style.setProperty("--p", ((cur + 1) / slides.length * 100) + "%");
  }

  document.addEventListener("keydown", e => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(slides.length - 1);
    else if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
    }
    else if (e.key === "n" || e.key === "N") document.body.classList.toggle("show-notes");
    else if (e.key === "o" || e.key === "O") document.body.classList.toggle("overview");
  });
  // click on a slide in overview mode jumps to it; otherwise click = next
  document.addEventListener("click", e => {
    const s = e.target.closest(".slide");
    if (document.body.classList.contains("overview") && s) {
      document.body.classList.remove("overview"); show(slides.indexOf(s)); return;
    }
    if (e.target.closest("a, pre, code, button")) return;
    if (e.clientX > window.innerWidth * 0.5) show(cur + 1); else show(cur - 1);
  });

  document.addEventListener("DOMContentLoaded", build);
})();
</script>
