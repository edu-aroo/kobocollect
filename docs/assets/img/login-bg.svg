<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
<!-- Login background: "field survey → digital form → data → analysis".
     The centre is left calm (the login card sits there). Replace this file
     (or change loginBackground in assets/config.js) to use another image. -->
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#072a40"/><stop offset=".55" stop-color="#0b3d5c"/><stop offset="1" stop-color="#14707c"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".14"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1b7f8c" stop-opacity=".45"/><stop offset="1" stop-color="#1b7f8c" stop-opacity="0"/></radialGradient>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" fill-opacity=".45"/></marker>
</defs>
<rect width="1920" height="1080" fill="url(#sea)"/>
<circle cx="960" cy="540" r="520" fill="url(#glow)"/>

<!-- coastline and waves along the bottom -->
<g fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2">
<path d="M0 990 C 160 960, 320 1020, 480 990 S 800 960, 960 990 S 1280 1020, 1440 990 S 1760 960, 1920 990"/>
<path d="M0 1030 C 160 1000, 320 1060, 480 1030 S 800 1000, 960 1030 S 1280 1060, 1440 1030 S 1760 1000, 1920 1030"/>
</g>

<!-- ============ LEFT TOP: paper questionnaire on a clipboard ============ -->
<g transform="translate(110 90) rotate(-6)">
<rect width="330" height="420" rx="14" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<rect x="115" y="-16" width="100" height="34" rx="8" fill="#ffffff" fill-opacity=".18" stroke="#ffffff" stroke-opacity=".3"/>
<g font-family="Source Sans 3, Arial, sans-serif" fill="#ffffff" fill-opacity=".55">
<text x="28" y="56" font-size="22" font-weight="700" fill-opacity=".7">Fiche d'enquête</text>
<text x="28" y="100" font-size="16">Village</text><text x="28" y="160" font-size="16">Engin principal</text>
<text x="28" y="250" font-size="16">Espèces débarquées</text><text x="28" y="350" font-size="16">Poids (kg)</text>
</g>
<g stroke="#ffffff" stroke-opacity=".3" fill="none" stroke-width="2">
<path d="M120 104H300"/><path d="M120 354H220"/>
<circle cx="38" cy="186" r="8"/><circle cx="148" cy="186" r="8"/><circle cx="38" cy="214" r="8"/>
<rect x="30" y="268" width="16" height="16" rx="3"/><rect x="140" y="268" width="16" height="16" rx="3"/><rect x="30" y="298" width="16" height="16" rx="3"/>
</g>
<circle cx="148" cy="186" r="4" fill="#9fe3d8" fill-opacity=".8"/>
<path d="M32 276 l5 5 l9 -11" stroke="#9fe3d8" stroke-opacity=".85" stroke-width="3" fill="none"/>
<path d="M142 276 l5 5 l9 -11" stroke="#9fe3d8" stroke-opacity=".85" stroke-width="3" fill="none"/>
<g font-family="Source Sans 3, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".45">
<text x="54" y="191">Ligne</text><text x="164" y="191">Filet</text><text x="54" y="219">Fusil</text>
<text x="54" y="282">Poulpe</text><text x="164" y="282">Calmar</text><text x="54" y="312">Crabe</text>
<text x="128" y="349" font-family="Caveat, cursive" font-size="22" fill="#9fe3d8" fill-opacity=".7">12,5</text>
<text x="128" y="99" font-family="Caveat, cursive" font-size="22" fill="#9fe3d8" fill-opacity=".7">Ifaty</text>
</g>
</g>
<!-- pencil -->
<g transform="translate(400 470) rotate(38)" opacity=".35">
<rect width="150" height="16" rx="3" fill="#f2c14e"/><path d="M150 0 L176 8 L150 16 z" fill="#f6e2b3"/><rect x="-14" width="14" height="16" rx="3" fill="#e58a7a"/>
</g>

<!-- arrow paper -> phone -->
<path d="M420 560 C 470 610, 470 650, 430 690" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"/>

<!-- ============ LEFT BOTTOM: phone with a digital form ============ -->
<g transform="translate(200 600) rotate(5)">
<rect width="230" height="430" rx="30" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".32" stroke-width="2"/>
<rect x="16" y="46" width="198" height="350" rx="8" fill="#ffffff" fill-opacity=".08"/>
<rect x="90" y="18" width="50" height="8" rx="4" fill="#ffffff" fill-opacity=".25"/>
<rect x="16" y="46" width="198" height="40" rx="8" fill="#1b7f8c" fill-opacity=".55"/>
<g font-family="Source Sans 3, Arial, sans-serif" fill="#ffffff">
<text x="30" y="72" font-size="15" font-weight="700" fill-opacity=".8">Débarquement 3/11</text>
<text x="30" y="118" font-size="15" fill-opacity=".7">Nombre de pêcheurs *</text>
<text x="30" y="214" font-size="15" fill-opacity=".7">Engin principal *</text>
</g>
<rect x="30" y="130" width="168" height="34" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".4"/>
<text x="42" y="153" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#9fe3d8" fill-opacity=".9">3</text>
<g stroke="#ffffff" stroke-opacity=".4" fill="none" stroke-width="2"><circle cx="40" cy="240" r="8"/><circle cx="40" cy="270" r="8"/><circle cx="40" cy="300" r="8"/></g>
<circle cx="40" cy="270" r="4" fill="#9fe3d8"/>
<g font-family="Source Sans 3, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity=".55"><text x="56" y="245">Ligne à main</text><text x="56" y="275">Filet maillant</text><text x="56" y="305">Fusil harpon</text></g>
<rect x="30" y="340" width="168" height="38" rx="19" fill="#d9694a" fill-opacity=".6"/>
<text x="114" y="365" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" fill-opacity=".9">Suivant →</text>
</g>

<!-- ============ TOP CENTRE: sync to the server ============ -->
<g transform="translate(860 70)" opacity=".55">
<path d="M40 70 a30 30 0 0 1 8-58 a42 42 0 0 1 80 6 a28 28 0 0 1 14 52 z" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".5" stroke-width="2"/>
<path d="M78 58 V 30 M66 42 L78 30 L90 42" stroke="#9fe3d8" stroke-width="3" fill="none"/>
</g>
<path d="M460 640 C 600 360, 700 160, 850 120" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"/>
<path d="M1040 120 C 1200 140, 1290 170, 1360 210" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"/>

<!-- ============ RIGHT TOP: XLSForm / export spreadsheet ============ -->
<g transform="translate(1370 110) rotate(4)">
<rect width="470" height="330" rx="14" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<rect width="470" height="40" rx="14" fill="#217346" fill-opacity=".45"/>
<g fill="#ffffff" fill-opacity=".35"><circle cx="24" cy="20" r="6"/><circle cx="44" cy="20" r="6"/><circle cx="64" cy="20" r="6"/></g>
<g stroke="#ffffff" stroke-opacity=".18"><path d="M0 80H470M0 120H470M0 160H470M0 200H470M0 240H470M0 280H470"/><path d="M150 40V330M280 40V330M370 40V330"/></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#ffffff">
<g fill-opacity=".75" font-weight="700"><text x="14" y="66">type</text><text x="164" y="66">name</text><text x="294" y="66">required</text><text x="384" y="66">relevant</text></g>
<g fill-opacity=".5"><text x="14" y="106">date</text><text x="164" y="106">date</text><text x="294" y="106">yes</text>
<text x="14" y="146">select_one</text><text x="164" y="146">village</text><text x="294" y="146">yes</text>
<text x="14" y="186">integer</text><text x="164" y="186">nb_pech</text><text x="294" y="186">yes</text>
<text x="14" y="226">begin_repeat</text><text x="164" y="226">captures</text><text x="384" y="226" fill="#9fe3d8">${…}</text>
<text x="14" y="266">decimal</text><text x="164" y="266">poids</text><text x="294" y="266">yes</text>
<text x="14" y="306">calculate</text><text x="164" y="306">valeur</text></g>
</g>
<rect x="0" y="330" width="70" height="22" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".25"/>
<text x="10" y="346" font-family="Source Sans 3, Arial, sans-serif" font-size="13" font-weight="700" fill="#9fe3d8" fill-opacity=".8">survey</text>
</g>

<!-- arrow spreadsheet -> analysis -->
<path d="M1620 470 C 1660 520, 1660 560, 1630 600" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#ah)"/>

<!-- ============ RIGHT BOTTOM: analysis (charts) ============ -->
<g transform="translate(1390 620) rotate(-3)">
<rect width="440" height="330" rx="14" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<text x="24" y="40" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" fill-opacity=".6">Capture par engin (kg)</text>
<g stroke="#ffffff" stroke-opacity=".3"><path d="M40 280H250"/><path d="M40 70V280"/></g>
<g fill="#5bc0be" fill-opacity=".6"><rect x="58" y="150" width="34" height="130"/><rect x="108" y="100" width="34" height="180"/><rect x="158" y="190" width="34" height="90"/><rect x="208" y="225" width="34" height="55"/></g>
<g transform="translate(345 175)">
<circle r="68" fill="#ffffff" fill-opacity=".08"/>
<path d="M0 0 L0 -68 A68 68 0 0 1 64 23 z" fill="#d9694a" fill-opacity=".55"/>
<path d="M0 0 L64 23 A68 68 0 0 1 -40 55 z" fill="#f2c14e" fill-opacity=".5"/>
<path d="M0 0 L-40 55 A68 68 0 0 1 0 -68 z" fill="#5bc0be" fill-opacity=".5"/>
</g>
<path d="M280 300 Q 330 260 360 285 T 420 255" fill="none" stroke="#9fe3d8" stroke-opacity=".6" stroke-width="3"/>
</g>

<!-- ============ BOTTOM CENTRE: map with GPS points ============ -->
<g transform="translate(700 800)" opacity=".85">
<rect width="520" height="200" rx="14" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".18"/>
<path d="M20 40 C 120 70, 150 120, 230 130 S 380 110, 500 170" fill="none" stroke="#f6e2b3" stroke-opacity=".45" stroke-width="3"/>
<g fill="#d9694a" fill-opacity=".75">
<path d="M120 70 c-12 0 -18 9 -18 17 c0 12 18 27 18 27 s18 -15 18 -27 c0 -8 -6 -17 -18 -17 z"/>
<path d="M260 98 c-12 0 -18 9 -18 17 c0 12 18 27 18 27 s18 -15 18 -27 c0 -8 -6 -17 -18 -17 z"/>
<path d="M400 110 c-12 0 -18 9 -18 17 c0 12 18 27 18 27 s18 -15 18 -27 c0 -8 -6 -17 -18 -17 z"/>
</g>
<g fill="#ffffff" fill-opacity=".8"><circle cx="120" cy="87" r="5"/><circle cx="260" cy="115" r="5"/><circle cx="400" cy="127" r="5"/></g>
<text x="20" y="186" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#ffffff" fill-opacity=".4">-23.15  43.61  ±5 m</text>
</g>
