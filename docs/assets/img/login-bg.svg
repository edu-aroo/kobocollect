<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
<!-- Login background: "data analysis with R". Replace this file (or change
     loginBackground in assets/config.js) to use another illustration. -->
<defs>
<linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#072a40"/><stop offset=".55" stop-color="#0b3d5c"/><stop offset="1" stop-color="#14707c"/></linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".06"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1b7f8c" stop-opacity=".45"/><stop offset="1" stop-color="#1b7f8c" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1920" height="1080" fill="url(#sea)"/>
<circle cx="960" cy="540" r="520" fill="url(#glow)"/>
<!-- faint grid, like graph paper -->
<g stroke="#ffffff" stroke-opacity=".035"><path d="M0 120H1920M0 240H1920M0 360H1920M0 480H1920M0 600H1920M0 720H1920M0 840H1920M0 960H1920"/><path d="M120 0V1080M240 0V1080M360 0V1080M480 0V1080M600 0V1080M720 0V1080M840 0V1080M960 0V1080M1080 0V1080M1200 0V1080M1320 0V1080M1440 0V1080M1560 0V1080M1680 0V1080M1800 0V1080"/></g>

<!-- script editor (left) -->
<g transform="translate(90 120) rotate(-4)">
<rect width="560" height="380" rx="16" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<rect width="560" height="40" rx="16" fill="#ffffff" fill-opacity=".08"/>
<circle cx="26" cy="20" r="7" fill="#d9694a"/><circle cx="48" cy="20" r="7" fill="#e3b04b"/><circle cx="70" cy="20" r="7" fill="#4a7d3a"/>
<text x="100" y="26" font-family="Consolas,monospace" font-size="16" fill="#cfe3ea" fill-opacity=".8">analysis.R</text>
<g font-family="Consolas,'Courier New',monospace" font-size="19">
<text x="26" y="82" fill="#8fb7a0" fill-opacity=".85"># seagrass monitoring</text>
<text x="26" y="116" fill="#e8f1f4" fill-opacity=".9">sg <tspan fill="#e3b04b">&lt;-</tspan> <tspan fill="#7fd1dc">read.csv</tspan>(<tspan fill="#a8d08d">"data/quadrats.csv"</tspan>)</text>
<text x="26" y="150" fill="#e8f1f4" fill-opacity=".9">sg <tspan fill="#e3b04b">|&gt;</tspan></text>
<text x="56" y="184" fill="#e8f1f4" fill-opacity=".9"><tspan fill="#7fd1dc">group_by</tspan>(site) <tspan fill="#e3b04b">|&gt;</tspan></text>
<text x="56" y="218" fill="#e8f1f4" fill-opacity=".9"><tspan fill="#7fd1dc">summarise</tspan>(m = <tspan fill="#7fd1dc">mean</tspan>(cover),</text>
<text x="180" y="252" fill="#e8f1f4" fill-opacity=".9">s = <tspan fill="#7fd1dc">sd</tspan>(cover))</text>
<text x="26" y="300" fill="#8fb7a0" fill-opacity=".85"># plot</text>
<text x="26" y="334" fill="#e8f1f4" fill-opacity=".9"><tspan fill="#7fd1dc">ggplot</tspan>(res, <tspan fill="#7fd1dc">aes</tspan>(site, m)) <tspan fill="#e3b04b">+</tspan></text>
</g></g>

<!-- bar chart with error bars (right top) -->
<g transform="translate(1290 110) rotate(3)">
<rect width="520" height="340" rx="16" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<path d="M60 290H480M60 290V50" stroke="#cfe3ea" stroke-opacity=".6" stroke-width="2"/>
<g fill="#4fb3bf" fill-opacity=".75"><rect x="95" y="120" width="60" height="170" rx="4"/><rect x="195" y="160" width="60" height="130" rx="4"/></g>
<g fill="#e48b6c" fill-opacity=".8"><rect x="295" y="200" width="60" height="90" rx="4"/><rect x="395" y="175" width="60" height="115" rx="4"/></g>
<g stroke="#ffffff" stroke-opacity=".8" stroke-width="2.5"><path d="M125 90V150M115 90H135M115 150H135"/><path d="M225 130V190M215 130H235M215 190H235"/><path d="M325 175V225M315 175H335M315 225H335"/><path d="M425 145V205M415 145H435M415 205H435"/></g>
</g>

<!-- scatter plot with trend (right bottom) -->
<g transform="translate(1330 620) rotate(-3)">
<rect width="480" height="330" rx="16" fill="url(#win)" stroke="#ffffff" stroke-opacity=".22"/>
<path d="M50 280H440M50 280V40" stroke="#cfe3ea" stroke-opacity=".6" stroke-width="2"/>
<g fill="#a8d08d" fill-opacity=".85"><circle cx="90" cy="240" r="7"/><circle cx="120" cy="220" r="7"/><circle cx="150" cy="230" r="7"/><circle cx="180" cy="190" r="7"/><circle cx="210" cy="200" r="7"/><circle cx="245" cy="165" r="7"/><circle cx="275" cy="150" r="7"/><circle cx="300" cy="160" r="7"/><circle cx="330" cy="120" r="7"/><circle cx="360" cy="110" r="7"/><circle cx="390" cy="85" r="7"/><circle cx="415" cy="95" r="7"/></g>
<path d="M70 250L430 80" stroke="#e3b04b" stroke-width="3" stroke-dasharray="10 7" stroke-opacity=".9"/>
</g>

<!-- console (left bottom) -->
<g transform="translate(120 640) rotate(3)">
<rect width="500" height="300" rx="16" fill="#041b29" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".22"/>
<g font-family="Consolas,'Courier New',monospace" font-size="18" fill="#cfe3ea" fill-opacity=".85">
<text x="24" y="50">&gt; t.test(growth ~ season)</text>
<text x="24" y="86" fill-opacity=".6">  t = 3.41, df = 58, p-value = 0.0012</text>
<text x="24" y="130">&gt; cor(temp, growth)</text>
<text x="24" y="166" fill-opacity=".6">[1] 0.72</text>
<text x="24" y="210">&gt; nrow(survey)</text>
<text x="24" y="246" fill-opacity=".6">[1] 412</text>
<text x="24" y="282">&gt; <tspan fill="#e3b04b">▌</tspan></text>
</g></g>

<!-- small data table (top centre-left) -->
<g transform="translate(720 70) rotate(-2)" font-family="Consolas,monospace" font-size="15" fill="#cfe3ea" fill-opacity=".7">
<rect width="330" height="150" rx="12" fill="url(#win)" stroke="#ffffff" stroke-opacity=".18"/>
<text x="18" y="34" fill="#ffffff" fill-opacity=".85">site     depth  cover</text>
<text x="18" y="62">Ifaty    1.2    64</text><text x="18" y="88">Anakao   0.8    47</text><text x="18" y="114">Nosy Ve  2.1    58</text><text x="18" y="140">...</text>
</g>

<!-- map with stations (bottom centre) -->
<g transform="translate(760 860) rotate(2)">
<rect width="400" height="190" rx="14" fill="url(#win)" stroke="#ffffff" stroke-opacity=".18"/>
<path d="M30 160 C 70 120, 60 80, 110 60 S 170 40, 190 70 S 230 140, 280 120 S 360 60, 380 40" fill="none" stroke="#e3c98f" stroke-opacity=".8" stroke-width="4"/>
<g fill="#d9694a"><circle cx="120" cy="100" r="8"/><circle cx="210" cy="115" r="8"/><circle cx="300" cy="90" r="8"/></g>
<g fill="#4fb3bf"><circle cx="160" cy="135" r="6"/><circle cx="260" cy="145" r="6"/></g>
</g>

<!-- waves -->
<path d="M0 1010 C 160 980, 320 1040, 480 1010 S 800 980, 960 1010 S 1280 1040, 1440 1010 S 1760 980, 1920 1010 V1080 H0Z" fill="#ffffff" fill-opacity=".05"/>
<path d="M0 1040 C 200 1015, 360 1065, 560 1040 S 920 1015, 1120 1040 S 1520 1065, 1920 1035 V1080 H0Z" fill="#ffffff" fill-opacity=".06"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
